<li class="journal-item"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y年%m月%d日' }}</time><h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3><div class="post-categories">{% for category in include.post.categories %}<a href="{{ '/categories/' | relative_url }}#{{ category | uri_escape }}">{{ category | escape }}</a>{% endfor %}</div><div class="excerpt">{{ include.post.excerpt }}</div></li>
